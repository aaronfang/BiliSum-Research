name: PR policy

on:
  pull_request:
    branches:
      - master
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate-pr-policy:
    name: validate-pr-policy
    runs-on: ubuntu-latest
    steps:
      - name: Require a closing Issue reference
        uses: actions/github-script@v8
        with:
          script: |
            const pull = context.payload.pull_request;
            const body = pull.body || "";
            const closingReference = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+((?:[\w.-]+\/[\w.-]+)?#(\d+))\b/gi;
            const references = [...body.matchAll(closingReference)];
            const repository = context.payload.repository.full_name.toLowerCase();
            const localIssues = references.filter((match) => {
              const reference = match[1].toLowerCase();
              return !reference.includes("/") || reference.startsWith(`${repository}#`);
            });

            if (localIssues.length === 0) {
              core.setFailed("PR body must close an Issue in this repository, for example: Closes #123.");
              return;
            }

            let validIssue = false;
            for (const match of localIssues) {
              try {
                const response = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(match[2]),
                });
                if (!response.data.pull_request) {
                  validIssue = true;
                  break;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (!validIssue) {
              core.setFailed("The closing reference must identify an existing Issue, not a PR.");
            }

            if (pull.head.ref === context.payload.repository.default_branch) {
              core.setFailed("Open the PR from an Issue-scoped topic branch, not master.");
            }
